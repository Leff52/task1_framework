services:
  webservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr1-minwebservice
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/items || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
